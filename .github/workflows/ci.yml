name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# Cancela corridas viejas del mismo ref cuando llega un push nuevo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Capa 1 — Unit matrix: prueba que el código no esté roto por SO.
  # La suite mockea red/subprocess, así que valida lógica + paths + encoding por
  # plataforma, NO la instalación real (eso lo cubre el job smoke-install).
  # ---------------------------------------------------------------------------
  test:
    name: tests (${{ matrix.os }} · py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"] # piso y techo del rango soportado
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Instalar forge + dependencias de desarrollo
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check forge/ tests/

      - name: Tests (pytest)
        run: pytest -q

  # ---------------------------------------------------------------------------
  # Capa 2 — Smoke install: corre el `forge install` REAL (sin red) en cada SO
  # y verifica que deposite skills/agents y registre el hook PII. Esto valida la
  # instalación de verdad por plataforma, no solo la lógica mockeada.
  # ---------------------------------------------------------------------------
  smoke-install:
    name: smoke install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No-editable: hatchling copia la shared-data (skills/agents/commands) al
      # data dir del entorno, que es de donde get_share_root() los lee.
      - name: Instalar forge (no-editable, puebla la shared-data)
        run: pip install .

      # Sin red: --skip-engram-check (no descarga engram), --skip-codegraph
      # (no descarga binario), --skip-context7 (no registra MCP). El hook PII
      # SÍ se registra: es justo lo que queremos verificar.
      - name: forge install (sin red)
        run: forge install --skip-engram-check --skip-codegraph --skip-context7

      - name: Verificar el depósito real en ~/.claude/
        run: python .github/scripts/verify_install.py
