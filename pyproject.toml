[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forge"
version = "0.1.0"
description = "Spec-Driven Development workflow for Claude Code in critical environments — privacy, audit trail, strict permissions."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Fabricio Gomez", email = "fabricio.gomez4371@gmail.com" },
]
keywords = ["sdd", "spec-driven-development", "claude-code", "ai-tooling", "developer-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
dependencies = [
    "pyyaml>=6.0",
    "presidio-analyzer>=2.2,<3",
    "presidio-anonymizer>=2.2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
forge = "forge.cli:main"

[project.urls]
Homepage = "https://github.com/GomezFabricio/forge"
Repository = "https://github.com/GomezFabricio/forge"
Issues = "https://github.com/GomezFabricio/forge/issues"
Changelog = "https://github.com/GomezFabricio/forge/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["forge"]

[tool.hatch.build.targets.wheel.shared-data]
"skills" = "share/forge/skills"
"agents" = "share/forge/agents"
"config" = "share/forge/config"
"templates" = "share/forge/templates"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "slow: marks tests as slow (e2e subprocess tests that pay Presidio cold start)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["docs", "templates", "skills"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.coverage.report]
# Excluir la capa CLI (main, print_report) del umbral de cobertura.
# Estas funciones son presentación pura — no contienen lógica testeable del dominio.
exclude_lines = [
    "pragma: no cover",
    "def main",
    "def print_report",
    "if __name__",
]
